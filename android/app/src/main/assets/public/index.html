  <script>
    (function(){
      try {
        var t = localStorage.getItem('rdm-app-theme') || 'leather';
        if (t === 'turf' || t === 'azure' || t === 'crimson') {
          t = 'leather';
          localStorage.setItem('rdm-app-theme', 'leather');
        } else if (t === 'daylight') {
          t = 'alabaster';
          localStorage.setItem('rdm-app-theme', 'alabaster');
        } else if (t === 'night') {
          t = 'carbon';
          localStorage.setItem('rdm-app-theme', 'carbon');
        }
        if (!/^(leather|carbon|alabaster|copper)$/.test(t)) t = 'leather';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.getElementById('rdmThemeMeta');
        if (meta) {
          meta.content = t === 'carbon' ? '#090A0D' : (t === 'alabaster' ? '#F8FAFC' : (t === 'copper' ? '#F7F5F2' : '#FAF9F7'));
        }
      } catch (e) {}
      try {
        var host = location.hostname || '';
        if ((host === 'localhost' || host === '127.0.0.1' || host.endsWith('.run.app')) && 'serviceWorker' in navigator) {
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            if (!regs || !regs.length) return;
            Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).finally(function() {
                  if (hadController && !sessionStorage.getItem('rdm-sw-cleaned')) {
                    sessionStorage.setItem('rdm-sw-cleaned', '1');
                    location.reload();
                  }
                });
              } else if (hadController && !sessionStorage.getItem('rdm-sw-cleaned')) {
                sessionStorage.setItem('rdm-sw-cleaned', '1');
                location.reload();
              }
            });
          }).catch(function() {});
        }
      } catch (e) {}
    })();
  </script>
