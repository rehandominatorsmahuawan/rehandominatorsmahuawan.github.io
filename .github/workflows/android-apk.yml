name: Build RDM Official Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Assemble & Publish RDM Official APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        working-directory: .
        run: npm install --no-audit --no-fund

      - name: Build Android web assets & sync Capacitor
        working-directory: .
        run: npm run android:sync

      - name: Verify Website build & sync
        working-directory: .
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare RDM-Official.apk
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk RDM-Official.apk

      - name: Upload RDM Official APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDM-Official-apk
          path: |
            RDM-Official.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish RDM-Official.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="RDM Official Android APK"
          NOTES="RDM Official Android APK built automatically from commit ${{ github.sha }} with live Firebase sync."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RDM-Official.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" RDM-Official.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
