  <link rel="manifest" href="site.webmanifest">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rdm-web-theme') || 'light';
        if (!/^(light|dark)$/.test(t)) t = 'light';
        document.documentElement.setAttribute('data-web-theme', t);
        var meta = document.getElementById('rdmThemeMeta');
        if (meta) meta.content = t === 'dark' ? '#0B0E14' : '#FFFFFF';
      } catch (e) {}
      try {
        var host = location.hostname || '';
        if ((host === 'localhost' || host === '127.0.0.1' || host.endsWith('.run.app')) && 'serviceWorker' in navigator) {
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs || !regs.length) return;
            Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).finally(function () {
                  if (hadController && !sessionStorage.getItem('rdm-sw-cleaned')) {
                    sessionStorage.setItem('rdm-sw-cleaned', '1');
                    location.reload();
                  }
                });
              } else if (hadController && !sessionStorage.getItem('rdm-sw-cleaned')) {
                sessionStorage.setItem('rdm-sw-cleaned', '1');
                location.reload();
              }
            });
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
